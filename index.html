<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/alertifyjs@1.14.0/build/css/alertify.min.css"/>
    <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/alertifyjs@1.14.0/build/css/themes/bootstrap.min.css"/>
</head>
<body class="bg-light">

<div id="app">

    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <span class="navbar-brand">Biblioteca</span>
            <div>
                <button class="btn btn-outline-light btn-sm me-2" :class="{active: tab==='autores'}" @click="tab='autores'">Autores</button>
                <button class="btn btn-outline-light btn-sm" :class="{active: tab==='libros'}" @click="tab='libros'">Libros</button>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div v-show="tab === 'autores'">
            <comp-autores></comp-autores>
        </div>
        <div v-show="tab === 'libros'">
            <comp-libros></comp-libros>
        </div>
    </div>
</div>

<script src="//cdn.jsdelivr.net/npm/alertifyjs@1.14.0/build/alertify.min.js"></script>
<script src="https://unpkg.com/dexie/dist/dexie.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
<script src="componentes/main.js"></script>
</body>
</html>
